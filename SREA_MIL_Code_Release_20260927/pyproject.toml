[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "srea-mil"
version = "0.1.0"
description = "State-Relation Evidence Aggregation MIL for cervical cytology WSI classification"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "torch>=2.1"
]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["srea_mil*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
